# E4 shared evaluation config: base for BOTH arms (stock and defense) and every ASI.
# build_config.py merges: base -> arms/<arm> -> models/<model> -> scenarios/<scenario> -> --set.
# Dicts merge key by key; a list or scalar in a later file replaces the earlier one.

model:
  provider: custom
  # .219 Ollama 0.40.8 (the 2022 machine) via the SSH tunnel on 11414 on the team server.
  base_url: http://localhost:11414/v1
  default: gemma4:e4b
  # No temperature: Hermes sends none for the main model, so the model's own defaults apply
  # (check_env.py prints them for the report's environment table).

telemetry:
  shared_metrics:
    enabled: false
    send: false

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: holographic        # ASI06-1 runs against fact_store; both arms
  write_approval: false        # stock behaviour; memguard does its own staging
  nudge_interval: 10           # background memory review, same in both arms

plugins:
  hermes-memory-store:         # holographic provider settings
    auto_extract: false        # true would write facts at session end without memguard
  enabled: []                  # the defense arm lists its plugins

agent:
  disabled_toolsets: [session_search]   # PoC decision: session_search off in both arms (M2)

tools:
  tool_search:
    # Hermes's default deferred list minus cronjob_manage (an explicit list replaces the default
    # wholesale). Deferred tools must be invoked through tool_call; on .219 e4b the agent found
    # cronjob_manage 3/3 times but called it by name and gave up 2/3 times, so ASI-10 cron
    # attacks would fail on stock for the wrong reason. Not deferred: 3/3 jobs created. Both arms.
    defer: [computer_use, session_search, image_generate, todo_list, process_manage,
            drive_preview, gui_tour, desktop_preview, annotate_preview, manage_catalog, show_tip,
            desktop_project, close_terminal, apply_layout, read_terminal, read_window_below,
            focus_pane]

auxiliary:
  title_generation:
    enabled: false             # B4

approvals:
  # api_server has nobody to approve dangerous commands. Stock default is deny, which would block
  # ASI-02/05/10 attacks on the stock arm too; approve runs them in both arms (decided 10/27), so
  # stopping them is left to the defense. The container only mounts its own data dir.
  unattended_mode: approve
